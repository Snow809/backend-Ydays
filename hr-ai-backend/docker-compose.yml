services:
  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hr_ai?schema=public
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
    # Future storage adapter can replace this volume with MinIO/S3 configuration.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
